# Security CI (test-plan SECRET-01, DEP-01, XSS-04, INPUT-02, CI-01, CI-02 and the node --test suites; decision D16).
# Rules: every action pinned by commit SHA; every downloaded binary pinned by SHA-256 (values from the official
# release checksum files, fetched 2026-11-12, see docs/architecture/dependencies.md); default token permissions
# empty, each job asks only for contents: read; no secrets are used; no pull_request_target; untrusted PR values
# (branch names, labels) reach scripts only through env, never inline in run: blocks.
name: security

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-tests:
    name: node --test (security, tools, scripts/lib)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.16.0'
          package-manager-cache: false
      - name: tests/security
        run: |
          set -o pipefail
          node --test tests/security/*.test.mjs 2>&1 | tee security-tests.txt
      - name: tools
        run: node --test tools/*.test.mjs
      - name: scripts/lib
        run: node --test scripts/lib/*.test.mjs
      - name: Report NOT VERIFIED cases
        if: always()
        run: |
          n=$(grep -c 'NOT VERIFIED' security-tests.txt || true)
          {
            echo "### Security tests: ${n} case(s) NOT VERIFIED"
            echo "Live suites skip when no application is configured (SECURITY_BASE_URL). They are never counted as passed."
            echo '```'
            grep 'NOT VERIFIED' security-tests.txt | sed -E 's/^[^A-Za-z]*//' | head -50 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  secret-scan:
    name: secret scan (gitleaks, full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" gitleaks
      - name: Scan every commit
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 --log-opts="--all" .'

  dependency-audit:
    name: dependency audit (OSV-Scanner)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      OSV_VERSION: 2.7.1
      OSV_SHA256: fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install osv-scanner (pinned, checksum verified)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/osv-scanner" "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"
      - name: Scan lockfiles
        run: |
          set +e
          "$RUNNER_TEMP/osv-scanner" scan source --recursive .
          code=$?
          set -e
          if [ "$code" -eq 128 ]; then
            echo "### Dependency audit: NOT VERIFIED (no lockfile or package manifest in the repository yet)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$code"

  sast:
    name: SAST (semgrep, local rules)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SEMGREP_IMAGE: semgrep/semgrep@sha256:67518c174185a2043fdbed16c70631b79209499b3671178e7194379b48295a0d # 1.185.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rule self-test
        run: docker run --rm --network none -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" semgrep --test --metrics off .semgrep
      - name: Scan for raw HTML sinks and string-built queries
        run: docker run --rm --network none -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" semgrep scan --metrics off --disable-version-check --error --config .semgrep/security.yml --exclude .semgrep --exclude third-party --exclude .claude --exclude .agents --exclude skills .

  workflow-lint:
    name: workflow lint (actionlint, zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint (pinned, checksum verified)
        run: |
          f="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$f" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$f"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.32.0
          advanced-security: false
          online-audits: false
          persona: regular

  protected-files:
    name: protected files (CODING_STANDARDS section 7)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.16.0'
          package-manager-cache: false
      - name: Check
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'protected-change-approved') }}
        run: |
          flag=""
          if [ "$APPROVED" = "true" ]; then flag="--approved"; fi
          node tools/check-protected-files.mjs --branch "$HEAD_BRANCH" --base "$BASE_SHA" --head "$HEAD_SHA" $flag
