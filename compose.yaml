# Local development database only. Trust auth, bound to 127.0.0.1, so no password lives in the repo.
services:
  db:
    image: postgres:18.7-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
    environment:
      POSTGRES_DB: masar
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "masar"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  db-data:
